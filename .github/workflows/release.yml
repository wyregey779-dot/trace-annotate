name: Release packages

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build and validate release files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -m pip install build twine pytest
          python -m build
          python -m twine check dist/*
          python scripts/release_assets.py --expected-tag "$RELEASE_TAG"
      - name: Install and verify built wheel
        run: |
          python -m pip install dist/*.whl
          python scripts/check_installed_package.py
          python -m pytest tests -q
          python examples/demo_asset_pipeline.py
          python examples/demo_embodied_pipeline.py
          python examples/run_quickstart.py --output output/quickstart-release
      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  upload:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: dist
      - name: Upload verified packages to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --verify-tag \
              --title "TraceAnnotate $RELEASE_TAG" \
              --notes "Validated Python wheel and source distribution. Maintainer release notes are pending."
          fi
          gh release upload "$RELEASE_TAG" ./*.whl ./*.tar.gz SHA256SUMS
