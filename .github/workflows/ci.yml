name: CI

on:
  push:
    branches: [ main, master, 'feat/**' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install verified media toolchain on Linux
        if: runner.os == 'Linux'
        run: python .github/scripts/install_ci_media.py

      - name: Install media test prerequisites on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress

      - name: Require FFmpeg and ffprobe before running the test suite
        run: |
          python -c "import shutil; assert shutil.which('ffmpeg') and shutil.which('ffprobe'), 'FFmpeg and ffprobe are required for media regressions'"
          ffmpeg -version
          ffprobe -version

      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine pytest tomli
          python -m build

      - name: Validate distribution metadata and contents
        run: |
          python -m twine check dist/*
          python scripts/release_assets.py

      - name: Install built wheel
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', glob.glob('dist/*.whl')[0]])"

      - name: Check installed CLI and packaged resources outside source tree
        run: python scripts/check_installed_package.py

      - name: Run test suite
        run: |
          python -m pytest tests -v -rs

      - name: Retain reproducible timing diagnostics after a failure
        if: failure()
        run: python scripts/diagnose_media_timing.py --output output/media-timing-diagnostics

      - name: Upload media timing failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: media-timing-${{ matrix.os }}-py${{ matrix.python-version }}
          path: output/media-timing-diagnostics
          if-no-files-found: warn

      - name: Run documented examples
        run: |
          python examples/demo_asset_pipeline.py
          python examples/demo_embodied_pipeline.py
          python examples/run_quickstart.py --output output/quickstart-ci

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install synthetic media and browser test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install ".[dev,browser-test]"
          python -m playwright install --with-deps chromium

      - name: Install verified media toolchain for browser acceptance
        run: python .github/scripts/install_ci_media.py

      - name: Validate the general editor in isolated headless Chromium
        run: python scripts/check_general_editor.py --output output/browser-ci

      - name: Check edit integrity, review invalidation and recovery
        run: python scripts/check_editor_integrity.py --output output/editor-integrity-ci

      - name: Check full media identity, migration and cancelled loads
        run: python scripts/check_media_identity.py --output output/media-identity-ci

      - name: Reject audio-only and undecodable video without losing edits
        run: python scripts/check_media_admission.py --output output/media-admission-ci

      - name: Prepare incompatible media and verify the actual project editor
        run: python scripts/check_prepared_editor.py --output output/prepared-editor-ci

      - name: Record embodied editing and validate the actual downloaded annotations
        run: python scripts/check_embodied_editor.py --output output/embodied-editor-ci

      - name: Verify persistent multi-video workspace and displayed frame identity
        run: python scripts/check_workspace_editor.py --output output/workspace-editor-ci

      - name: Verify installed wheel editors without checkout imports
        run: |
          python -m pip install build
          python -m build --outdir output/workspace-dist
          python -m venv "${{ runner.temp }}/workspace-wheel-env"
          "${{ runner.temp }}/workspace-wheel-env/bin/python" -m pip install output/workspace-dist/*.whl playwright
          candidate_wheels=(output/workspace-dist/*.whl)
          test "${#candidate_wheels[@]}" -eq 1
          "${{ runner.temp }}/workspace-wheel-env/bin/python" -I scripts/check_workspace_editor.py --installed-wheel "${candidate_wheels[0]}" --output output/installed-workspace-ci

      - name: Upload browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: general-editor-browser-evidence
          path: |
            output/browser-ci
            output/editor-integrity-ci
            output/media-identity-ci
            output/media-admission-ci
            output/prepared-editor-ci
            output/embodied-editor-ci
            output/workspace-editor-ci
            output/installed-workspace-ci
          if-no-files-found: warn
