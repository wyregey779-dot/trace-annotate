name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest
          python -m build

      - name: Install built wheel
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', glob.glob('dist/*.whl')[0]])"

      - name: Check installed CLI and packaged resources outside source tree
        run: python scripts/check_installed_package.py

      - name: Run test suite
        run: |
          python -m pytest tests -v

      - name: Run documented examples
        run: |
          python examples/demo_asset_pipeline.py
          python examples/demo_embodied_pipeline.py
