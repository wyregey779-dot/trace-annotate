[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-annotate"
version = "1.1.0.dev1"
description = "Local media review, general video segment annotation, and embodied workflow tools."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "TraceAnnotate Contributors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "numpy>=1.20.0",
    "pillow>=9.0.0",
    "tqdm>=4.60.0"
]

[project.urls]
Homepage = "https://github.com/wyregey779-dot/trace-annotate"
Documentation = "https://github.com/wyregey779-dot/trace-annotate/blob/main/docs/QUICKSTART.md"
Repository = "https://github.com/wyregey779-dot/trace-annotate"
Issues = "https://github.com/wyregey779-dot/trace-annotate/issues"
Changelog = "https://github.com/wyregey779-dot/trace-annotate/blob/main/CHANGELOG.md"

[project.optional-dependencies]
cv = [
    "opencv-python>=4.5.0",
    "pillow-heif>=0.8.0"
]
persons = [
    "onnxruntime>=1.16,<2",
    "opencv-python>=4.5.0"
]
landmarks = [
    "mediapipe>=0.10.31,<0.11"
]
ocr = [
    "rapidocr-onnxruntime>=1.2.0"
]
clip = [
    "torch>=1.10.0",
    "torchvision>=0.11.0",
    "open-clip-torch>=2.20.0"
]
vlm = [
    # Florence-2 ships remote code that breaks on transformers >= 4.50
    # (_supports_sdpa / image_token attribute errors); 4.49.x is the tested window.
    "transformers>=4.49.0,<4.50",
    "einops>=0.7.0",
    "timm>=1.0.0"
]
full = [
    "opencv-python>=4.5.0",
    "pillow-heif>=0.8.0",
    "rapidocr-onnxruntime>=1.2.0",
    "torch>=1.10.0",
    "torchvision>=0.11.0",
    "open-clip-torch>=2.20.0",
    "transformers>=4.49.0,<4.50",
    "einops>=0.7.0",
    "timm>=1.0.0",
    "scenedetect>=0.6.0"
]
dev = [
    "pytest>=7.0.0"
]
browser-test = [
    "playwright>=1.48"
]

[project.scripts]
trace-annotate = "trace_annotate.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["trace_annotate*"]

[tool.setuptools.package-data]
trace_annotate = ["templates/*.json", "templates/*.xml", "embodied/ui/*.html", "temporal/ui/*.html", "temporal/ui/*.js", "temporal/ui/*.txt", "workspace/fonts/*.otf", "workspace/fonts/*.txt", "workspace/fonts/*.json", "workspace/fonts/*.md", "models/*.onnx", "models/*.md"]
