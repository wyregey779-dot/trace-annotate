<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TraceAnnotate 具身智能视频时序标注工作台 (Web Timeline Annotator)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0f19; color: #f1f5f9; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { background: #111827; border-bottom: 1px solid #1f2937; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 18px; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .btn { background: #2563eb; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
    .btn:hover { background: #1d4ed8; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-secondary { background: #374151; }
    .btn-secondary:hover { background: #4b5563; }
    .btn-success { background: #16a34a; }
    .btn-success:hover { background: #15803d; }
    .btn-danger { background: #dc2626; }
    .btn-danger:hover { background: #b91c1c; }
    
    .main { display: flex; flex: 1; overflow: hidden; }
    .video-pane { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
    video { width: 100%; height: 100%; max-height: calc(100vh - 280px); object-fit: contain; }
    
    .timeline-container { background: #111827; border-top: 1px solid #1f2937; padding: 14px 20px; height: 140px; display: flex; flex-direction: column; justify-content: space-between; }
    .timeline-bar { height: 48px; background: #1e293b; border-radius: 6px; position: relative; cursor: pointer; overflow: hidden; }
    .track-segment { position: absolute; top: 0; height: 100%; border-radius: 3px; font-size: 11px; display: flex; align-items: center; justify-content: center; font-weight: bold; overflow: hidden; white-space: nowrap; transition: opacity 0.15s; }
    .track-segment:hover { opacity: 0.9; }
    .track-working { background: #16a34a; color: #fff; border-left: 2px solid #4ade80; border-right: 2px solid #4ade80; }
    .track-error { background: #dc2626; color: #fff; border-left: 2px solid #f87171; border-right: 2px solid #f87171; }
    .track-idle { background: #475569; color: #cbd5e1; }
    .track-mid { background: #f59e0b; color: #000; height: 16px; top: 2px; }
    .playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: #ef4444; z-index: 10; pointer-events: none; }
    
    .controls-bar { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #94a3b8; }
    
    .sidebar { width: 360px; background: #111827; border-left: 1px solid #1f2937; display: flex; flex-direction: column; padding: 16px; overflow-y: auto; }
    .sidebar h2 { font-size: 15px; color: #e2e8f0; margin-bottom: 12px; border-bottom: 1px solid #1f2937; padding-bottom: 6px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    .form-control { width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 7px 10px; color: #fff; font-size: 13px; }
    .form-control:focus { outline: none; border-color: #38bdf8; }
    textarea.form-control { resize: vertical; min-height: 60px; }
    .seg-list { list-style: none; margin-top: 10px; }
    .seg-item { background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 8px 12px; margin-bottom: 8px; cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
    .seg-item.active { border-color: #38bdf8; background: #1e3a5f; }
    :root{color-scheme:dark}body{height:auto;min-height:100vh;overflow:auto;background:#090e17;color:#ecf4ff;font-size:15px}header{padding:21px 30px;background:#101925;border-color:#2c3b50;gap:18px;flex-wrap:wrap}header h1{font-size:26px;letter-spacing:-.5px;color:#edf8ff}.brand p{color:#acbed3;font-size:12px;margin-top:3px}.local-badge{color:#71ddaf;font-size:12px;align-self:center;margin-right:10px}.btn{min-height:38px;padding:9px 14px;background:#1e6379;border:1px solid #51aec3;border-radius:7px}.btn-secondary{background:#1d2b3f;border-color:#3a4c65}.btn-success{background:#164d3d;border-color:#3d9677}.btn-danger{background:#532d37;border-color:#a76b7d}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #72dce9;outline-offset:3px}.project-fields{margin:22px 30px 18px;padding:17px 20px;background:#111b29;border:1px solid #2c3c52;border-radius:10px;display:grid;grid-template-columns:minmax(280px,1fr) 190px minmax(200px,.65fr);gap:22px}.project-fields .form-group{margin:0}.hint{font-size:11px;color:#aabbd0;margin-top:6px}.form-group label{color:#bed0e4;font-size:12px}.form-control{background:#0d1623;border-color:#3a4c65;min-height:39px}.file-meta{min-width:0;align-self:center}.file-meta strong{overflow-wrap:anywhere;font-size:14px}.file-meta p{font-size:12px;color:#aabbd0;margin-top:5px}.main{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(390px,1fr);gap:18px;margin:0 30px;overflow:visible;align-items:start}.video-pane{background:#05090f;border:1px solid #2d3c51;border-radius:10px;overflow:hidden}.pane-heading{padding:15px 18px;font-size:14px;background:#111b29;border-bottom:1px solid #2c3c52}.pane-heading span{float:right;letter-spacing:1px;font-size:10px;color:#aabdd5}video{height:456px;max-height:none;object-fit:contain;background:#020508}.seek-controls{display:flex;align-items:center;gap:10px;padding:15px 18px;background:#111b29;flex-wrap:wrap;font-size:12px;color:#b8cbe1}.seek-controls input{width:105px}.seek-controls #timeDisplay{margin-left:auto;color:#79d9e9;font:13px Consolas,monospace}.right-stack{display:grid;gap:16px;min-width:0}.timeline-container{height:auto;min-height:170px;border:1px solid #2c3c52;border-radius:10px;padding:17px 18px;gap:16px}.controls-bar{flex-wrap:wrap;gap:10px}.controls-bar>div{display:flex;gap:6px;flex-wrap:wrap}.controls-bar .btn{padding:7px 10px;font-size:12px}.timeline-bar{height:55px;flex:none;background:#0c1420;border:1px solid #3d4e67}.track-working{background:#215947;border-color:#67cfa4}.track-pending{background:#5b492a;color:#ffe4ae;border-color:#d1ae6c}.track-idle{background:#29394e;color:#bacbe0}.track-error{background:#893b4c;border-color:#e88da3}.track-segment{border-radius:3px;min-height:0;padding:0;cursor:pointer}.timeline-summary{display:flex;gap:22px;color:#b5c7de;font:12px Consolas,monospace;flex-wrap:wrap}.timeline-summary strong{color:#77e7b3;font-weight:400}.sidebar{width:auto;overflow:visible;border:1px solid #2c3c52;border-radius:10px;padding:18px;background:#111b29}.sidebar h2,#segmentPanel h2{font-size:14px;color:#e1ecfc;margin:0 0 14px;padding:0;border:none}.sidebar .form-group{margin-bottom:10px}.sidebar .form-control{min-height:35px;padding:6px 10px}#annotationStatus{border-left:3px solid #509eb3;background:#102b3b;padding:10px 12px;color:#c0d8e7!important;font-size:12px!important;min-height:38px}#segmentPanel{margin:18px 30px 0;padding:17px 18px;background:#111b29;border:1px solid #2c3c52;border-radius:10px}.seg-list{margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.seg-item{padding:0;margin:0;display:block;min-width:0;border:0;background:transparent}.segment-button{padding:12px 14px;width:100%;min-height:63px;display:flex;justify-content:space-between;align-items:center;text-align:left;gap:12px;color:#e3efff;background:#142337;border:1px solid #354c66;border-radius:7px;cursor:pointer}.seg-item.active .segment-button{border-color:#69ccdf;background:#153848}.segment-button small{display:block;margin-top:5px;color:#adbed2;font:11px Consolas,monospace}.segment-label{overflow-wrap:anywhere;font-size:13px}.precision-note{margin:14px 30px 24px;color:#a7bbd2;font-size:11px}.empty-segments{color:#aabdd5;font-size:13px;grid-column:1/-1}
    @media(max-width:1050px){.main{grid-template-columns:1fr}.project-fields{grid-template-columns:minmax(0,1fr) 180px}.file-meta{grid-column:1/-1}.video-pane video{height:auto;aspect-ratio:16/9}.seg-list{grid-template-columns:1fr}.right-stack{gap:16px}}
    @media(max-width:600px){header{padding:18px}.project-fields{margin:16px;grid-template-columns:1fr;padding:14px}.file-meta{grid-column:auto}.main{margin:0 16px;grid-template-columns:minmax(0,1fr)}#segmentPanel{margin:16px 16px 0}.precision-note{margin:14px 16px}.local-badge{display:none}.controls-bar>div{gap:6px}.seek-controls #timeDisplay{margin:0;width:100%}header>div{flex-wrap:wrap}.btn{max-width:100%}}
  </style>
</head>
<body>

<header>
  <div class="brand"><h1>TraceAnnotate</h1><p>动作时序标注工作台 · Embodied timeline</p></div>
  <div style="display: flex; gap: 8px;">
    <span class="local-badge">● 本地文件</span><button id="openVideo" class="btn btn-secondary">打开视频</button>
    <input type="file" id="fileInput" accept="video/mp4,video/webm" style="display:none;">
    <button id="exportJSON" class="btn" data-requires-video disabled>导出 JSON</button>
    <button id="computeIdle" class="btn btn-success" data-requires-video disabled>计算 Idle 补集</button>
  </div>
</header>
<section class="project-fields" aria-label="任务信息">
  <div class="form-group"><label for="taskDescription">任务描述</label><input id="taskDescription" class="form-control" placeholder="按实际任务填写；不会自动生成标注" data-requires-video disabled><p class="hint">完整质检需要填写；未完成的草稿仍可保存。</p></div>
  <div class="form-group"><label for="expectedSteps">规程预期步骤数</label><input id="expectedSteps" type="number" class="form-control" min="1" max="100000" step="1" placeholder="未声明" data-requires-video disabled><p class="hint">依据规程填写，不按段数推断。</p></div>
  <div class="file-meta"><strong id="fileName">尚未打开视频</strong><p id="mediaMetadata">选择本地 MP4 或 WebM，等待加载完成。</p></div>
</section>

<main class="main" id="workspace">
  <div class="video-pane">
    <div class="pane-heading">视频预览 <span>LOCAL REVIEW</span></div><video id="videoPlayer" width="1280" height="720" controls aria-label="待标注视频"></video>
    <div class="seek-controls"><label for="seekSeconds">定位秒数</label><input id="seekSeconds" type="number" min="0" step="0.001" value="0" class="form-control" data-requires-video disabled><button id="seekTo" class="btn btn-secondary" data-requires-video disabled>定位</button><span id="timeDisplay">00:00.000 / 00:00.000</span></div>
    <div class="timeline-container">
      <div class="controls-bar">
        <div>
          <button id="stepBack" class="btn btn-secondary" data-requires-video disabled>− 1/30s</button>
          <button id="togglePlay" class="btn btn-secondary" data-requires-video disabled>播放 / 暂停</button>
          <button id="stepForward" class="btn btn-secondary" data-requires-video disabled>+ 1/30s</button>
        </div>
        <div style="display: flex; gap: 8px;">
          <button id="markStart" class="btn btn-success" data-requires-video disabled>[ 设为起点</button>
          <button id="markEnd" class="btn btn-success" data-requires-video disabled>设为终点 ]</button>
        </div>
      </div>
      <div class="timeline-bar" id="timelineBar">
        <div class="playhead" id="playhead"></div>
      </div>
      <div class="timeline-summary"><span>Working <strong id="workingDuration">0.000s</strong></span><span>Idle <strong id="idleDuration">未计算</strong></span><span id="segmentCount">0 个工作段</span></div>
    </div>
  </div>

  <div class="sidebar">
    <h2>段落属性</h2>
    <p id="annotationStatus" role="status" aria-live="polite" style="font-size:12px; color:#94a3b8; margin-bottom:12px;">请打开本地视频后开始标注。</p>
    <div class="form-group">
      <label for="segmentLabel">片段标签</label><input id="segmentLabel" class="form-control" placeholder="例如：定位组件" disabled>
    </div><div class="form-group">
      <label for="inpStep">流程步骤编号</label>
      <input type="number" id="inpStep" class="form-control" value="1" min="1" max="100000">
    </div>
    <div class="form-group">
      <label for="selVerdict">执行判定 · 新段等待人工确认</label>
      <select id="selVerdict" class="form-control">
        <option value="对">对 (正确执行)</option>
        <option value="错">错 (执行失败/违背规程)</option>
        <option value="无法判断" selected>无法判断</option>
      </select>
    </div>
    <div class="form-group" id="grpErrorType" style="display:none;">
      <label for="selErrorType">错误子类</label>
      <select id="selErrorType" class="form-control">
        <option value="遗漏步骤">遗漏步骤</option>
        <option value="顺序错误">顺序错误</option>
        <option value="重复/多做">重复/多做</option>
        <option value="用错物体">用错物体</option>
        <option value="操作方式错误">操作方式错误</option>
        <option value="意外事故">意外事故</option>
        <option value="其他">其他</option>
      </select>
    </div>
    <div class="form-group" id="grpEvidence" style="display:none;">
      <label for="txtEvidence">错误证据</label>
      <textarea id="txtEvidence" class="form-control" placeholder="例: t=22s 第3步固定螺母出现在第2步支撑轴之前"></textarea>
    </div>
    <div style="display: flex; gap: 8px; margin-top: 8px;">
      <button id="deleteSegment" class="btn btn-danger" style="flex:1" disabled>🗑 删除当前段</button>
    </div>

    <section id="segmentPanel"><h2>已标注段落</h2><ul class="seg-list" id="segList"></ul></section>
  </div>
</main>
<p class="precision-note">秒级定位与 1/30 秒步进不保证逐帧定位。Idle 是时间补集，导出文件仍需机器质检与视频内容复核。</p>

<script>
let video = document.getElementById('videoPlayer');
let playhead = document.getElementById('playhead');
let timelineBar = document.getElementById('timelineBar');
let timeDisplay = document.getElementById('timeDisplay');

let annotation = {
  clip: "",
  duration: null,
  text_description: "",
  clip_status: "正常",
  working: [],
  idle: []
};
let selectedIdx = -1;
let tempStart = null;
let videoObjectURL = null;
let videoReady = false;
let idleComputed = false;
let loadEpoch=0;
const timelinePanel=document.querySelector('.timeline-container'),sidebar=document.querySelector('.sidebar');
const rightStack=document.createElement('div');rightStack.className='right-stack';
document.querySelector('.main').append(rightStack);rightStack.append(timelinePanel,sidebar);
document.querySelector('.main').after(document.getElementById('segmentPanel'));

function updateProjectFields(){
  annotation.text_description=document.getElementById('taskDescription').value;
  const input=document.getElementById('expectedSteps'),raw=input.value,n=Number(raw);
  if(raw===''){delete annotation.expected_step_count;return true;}
  if(!Number.isInteger(n)||n<1||n>100000){setStatus('规程预期步骤数必须是 1 到 100000 的整数，或留空。');return false;}
  annotation.expected_step_count=n;return true;
}
document.getElementById('taskDescription').addEventListener('input',updateProjectFields);
document.getElementById('expectedSteps').addEventListener('input',updateProjectFields);
document.getElementById('segmentLabel').addEventListener('change',updateSelectedSegment);
function seekToSeconds(){
  if(!requireVideo())return;const input=document.getElementById('seekSeconds'),time=Number(input.value);
  if(input.value===''||!Number.isFinite(time)||time<0||time>annotation.duration){setStatus('定位秒数必须在 0 到视频时长之间。');return;}
  video.pause();video.currentTime=time;setStatus('已请求秒级定位至 '+formatTime(time)+'；不保证逐帧定位。');
}
document.getElementById('seekTo').addEventListener('click',seekToSeconds);
document.getElementById('seekSeconds').addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();seekToSeconds();}});

function setStatus(message) {
  document.getElementById('annotationStatus').textContent = message;
}

function updateVideoControls() {
  document.querySelectorAll('[data-requires-video]').forEach(button => {
    button.disabled = !videoReady;
  });
}

function requireVideo() {
  if (videoReady && Number.isFinite(annotation.duration) && annotation.duration > 0) return true;
  setStatus('请先打开视频，等待时长加载完成。');
  return false;
}

function loadVideoFile(input) {
  if (input.files && input.files[0]) {
    let file = input.files[0];
    input.value='';
    if(annotation.working.length&&!confirm('打开其他视频会清空当前标注，请先导出 JSON。是否继续？')){setStatus('已取消切换，当前标注未变更。');return;}
    const epoch=++loadEpoch;
    const candidate=document.createElement('video'),url=URL.createObjectURL(file);candidate.preload='auto';
    let done=false;const timer=setTimeout(()=>rejectCandidate('首帧解码超时'),15000);
    function releaseCandidate(){clearTimeout(timer);candidate.onloadeddata=null;candidate.onerror=null;candidate.removeAttribute('src');candidate.load();}
    function rejectCandidate(reason){if(done)return;done=true;releaseCandidate();URL.revokeObjectURL(url);if(epoch===loadEpoch)setStatus('视频加载失败：'+reason+'。当前视频与标注未变更。');}
    candidate.onerror=()=>rejectCandidate('浏览器无法解码文件');
    candidate.onloadeddata=()=>{
      if(done)return;
      if(epoch!==loadEpoch){rejectCandidate('已被新选择替代');return;}
      if(!Number.isFinite(candidate.duration)||candidate.duration<=0||candidate.videoWidth<=0){rejectCandidate('文件没有可解码的视频画面');return;}
      done=true;releaseCandidate();
    video.pause();
    if (videoObjectURL) URL.revokeObjectURL(videoObjectURL);
    videoReady = false;
    annotation = { clip: file.name, duration: null, text_description: '', clip_status: '正常', working: [], idle: [] };
    idleComputed = false;
    document.getElementById('taskDescription').value='';document.getElementById('expectedSteps').value='';
    document.getElementById('fileName').textContent=file.name;
    selectedIdx = -1;
    tempStart = null;
    timeDisplay.textContent = '00:00.00 / 00:00.00';
    playhead.style.left = '0%';
    updateVideoControls();
    renderTimeline();
    setStatus('正在加载视频：' + file.name);
    videoObjectURL = url;
    video.src = videoObjectURL;
    video.load();
    };
    candidate.src=url;candidate.load();
  }
}

video.ontimeupdate = () => {
  if (!videoReady) return;
  let cur = video.currentTime;
  let dur = annotation.duration;
  timeDisplay.textContent = formatTime(cur) + " / " + formatTime(dur);
  playhead.style.left = (cur / dur * 100) + "%";
};

video.onloadedmetadata = () => {
  if (video.currentSrc !== videoObjectURL) return;
  if (!Number.isFinite(video.duration) || video.duration <= 0) {
    setStatus('无法读取有效视频时长，请选择其他视频。');
    return;
  }
  annotation.duration = video.duration;
  document.getElementById('seekSeconds').max=String(video.duration);
  document.getElementById('mediaMetadata').textContent=video.duration.toFixed(3)+' 秒 · '+video.videoWidth+' × '+video.videoHeight;
  videoReady = true;
  updateVideoControls();
  timeDisplay.textContent = formatTime(video.currentTime) + ' / ' + formatTime(annotation.duration);
  setStatus('已加载：' + annotation.clip + '。尚无工作段，请设置起点和终点。');
  renderTimeline();
};

video.onerror = () => {
  if (!videoObjectURL) return;
  videoReady = false;
  annotation.duration = null;
  updateVideoControls();
  setStatus('视频加载失败，请选择浏览器支持的 MP4 或 WebM 文件。');
};

window.addEventListener('beforeunload', () => {
  if (videoObjectURL) URL.revokeObjectURL(videoObjectURL);
});

function formatTime(s) {
  const total=Math.round(s*1000),m=Math.floor(total/60000),sec=Math.floor(total%60000/1000);
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')+'.'+String(total%1000).padStart(3,'0');
}

function togglePlay() {
  if (!requireVideo()) return;
  if (video.paused) video.play().catch(() => setStatus('视频暂时无法播放，请重试或选择其他文件。')); else video.pause();
}

function stepFrame(delta) {
  if (!requireVideo()) return;
  video.pause();
  video.currentTime = Math.max(0, Math.min(annotation.duration, video.currentTime + delta * (1 / 30.0)));
}

function seekTimeline(e) {
  if (!requireVideo()) return;
  let rect = timelineBar.getBoundingClientRect();
  let ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  video.currentTime = ratio * annotation.duration;
}

function markWorkingStart() {
  if (!requireVideo()) return;
  tempStart = video.currentTime;
  setStatus('已设起点 ' + formatTime(tempStart) + '，移动到终点后点击“设为终点”。');
}

function markWorkingEnd() {
  if (!requireVideo()) return;
  if (tempStart === null) {
    setStatus('请先设置工作段起点。');
    return;
  }
  let start = tempStart;
  let end = Math.min(annotation.duration, video.currentTime);
  if (end <= start) {
    setStatus('终点必须晚于起点，请移动视频后重试。');
    return;
  }
  if (annotation.working.some(w => start < w.end && end > w.start)) {
    setStatus('工作段不能重叠，请选择尚未标注的时间区间。');
    return;
  }
  let segment = {
      start: start,
      end: end,
      step_number: annotation.working.length + 1,
      label: '',
      verdict: "无法判断",
      error_type: null,
      evidence: ""
  };
  annotation.working.push(segment);
  annotation.working.sort((a,b) => a.start - b.start);
  annotation.idle = [];
  idleComputed = false;
  selectedIdx = annotation.working.indexOf(segment);
  tempStart = null;
  renderTimeline();
  setStatus('已添加工作段，判定默认为“无法判断”，请人工确认。');
}

function renderTimeline() {
  let dur = annotation.duration;
  // Clear old segments
  let old = timelineBar.querySelectorAll('.track-segment');
  old.forEach(el => el.remove());
  if (!videoReady || !Number.isFinite(dur) || dur <= 0) {
    renderList();
    loadSelectedSegmentToForm();
    return;
  }

  // Render idle
  annotation.idle.forEach(i => {
    let el = document.createElement('div');
    el.className = 'track-segment track-idle';
    el.style.left = (i.start / dur * 100) + "%";
    el.style.width = ((i.end - i.start) / dur * 100) + "%";
    el.textContent = "idle";
    timelineBar.appendChild(el);
  });

  // Render working
  annotation.working.forEach((w, idx) => {
    let el = document.createElement('button');el.type='button';
    el.className = 'track-segment ' + (w.verdict === '错' ? 'track-error' : w.verdict === '无法判断' ? 'track-pending' : 'track-working');
    el.style.left = (w.start / dur * 100) + "%";
    el.style.width = ((w.end - w.start) / dur * 100) + "%";
    el.textContent = "步骤 " + w.step_number + (w.verdict === '错' ? ' (错)' : w.verdict === '无法判断' ? ' (待判定)' : '');
    el.addEventListener('click',e=>{e.stopPropagation();selectSegment(idx);});
    timelineBar.appendChild(el);
  });

  renderList();
  loadSelectedSegmentToForm();
}

function selectSegment(idx) {
  selectedIdx = idx;
  renderTimeline();
}

function renderList() {
  document.getElementById('workingDuration').textContent=annotation.working.reduce((sum,w)=>sum+w.end-w.start,0).toFixed(3)+'s';
  document.getElementById('idleDuration').textContent=idleComputed?annotation.idle.reduce((sum,w)=>sum+w.end-w.start,0).toFixed(3)+'s':'未计算';
  document.getElementById('segmentCount').textContent=annotation.working.length+' 个工作段';
  let list = document.getElementById('segList');
  list.replaceChildren();
  annotation.working.forEach((w, idx) => {
    let li = document.createElement('li');
    li.className = 'seg-item ' + (idx === selectedIdx ? 'active' : '');
    const button=document.createElement('button');button.type='button';button.className='segment-button';button.setAttribute('aria-pressed',String(idx===selectedIdx));
    let label = document.createElement('span');label.className='segment-label';
    label.textContent = 'S'+w.step_number+' · '+(w.label||'未命名片段');
    const times=document.createElement('small');times.textContent=formatTime(w.start)+' → '+formatTime(w.end);label.append(times);
    let verdict = document.createElement('span');
    verdict.style.color = w.verdict === '错' ? '#f87171' : w.verdict === '对' ? '#4ade80' : '#cbd5e1';
    verdict.textContent = w.verdict;
    button.append(label,verdict);button.addEventListener('click',()=>selectSegment(idx));li.append(button);
    list.appendChild(li);
  });
  if(!annotation.working.length){const empty=document.createElement('li');empty.className='empty-segments';empty.textContent='尚无工作段。设置起点和终点以添加第一段。';list.append(empty);}
}

function loadSelectedSegmentToForm() {
  let selected = selectedIdx >= 0 && selectedIdx < annotation.working.length;
  ['segmentLabel','inpStep', 'selVerdict', 'selErrorType', 'txtEvidence', 'deleteSegment'].forEach(id => {
    document.getElementById(id).disabled = !selected;
  });
  if (!selected) {
    document.getElementById('inpStep').value = 1;
    document.getElementById('segmentLabel').value='';
    document.getElementById('selVerdict').value = '无法判断';
    document.getElementById('txtEvidence').value = '';
    document.getElementById('grpErrorType').style.display = 'none';
    document.getElementById('grpEvidence').style.display = 'none';
    return;
  }
  let w = annotation.working[selectedIdx];
  document.getElementById('segmentLabel').value=w.label||'';
  document.getElementById('inpStep').value = w.step_number;
  document.getElementById('selVerdict').value = w.verdict;
  document.getElementById('selErrorType').value = w.error_type || "操作方式错误";
  document.getElementById('txtEvidence').value = w.evidence || "";
  let isWrong = w.verdict === '错';
  document.getElementById('grpErrorType').style.display = isWrong ? 'block' : 'none';
  document.getElementById('grpEvidence').style.display = isWrong ? 'block' : 'none';
}

function onVerdictChange() {
  let isWrong = document.getElementById('selVerdict').value === '错';
  document.getElementById('grpErrorType').style.display = isWrong ? 'block' : 'none';
  document.getElementById('grpEvidence').style.display = isWrong ? 'block' : 'none';
  updateSelectedSegment();
}

function updateSelectedSegment() {
  if (selectedIdx < 0 || selectedIdx >= annotation.working.length) return;
  let w = annotation.working[selectedIdx];
  let step = Number(document.getElementById('inpStep').value);
  if (!Number.isInteger(step) || step < 1 || step > 100000) {
    document.getElementById('inpStep').value = w.step_number;
    setStatus('步骤编号必须是 1 到 100000 的整数。');
    return;
  }
  w.step_number = step;
  w.label=document.getElementById('segmentLabel').value;
  w.verdict = document.getElementById('selVerdict').value;
  if (w.verdict === '错') {
    w.error_type = document.getElementById('selErrorType').value;
    w.evidence = document.getElementById('txtEvidence').value;
  } else {
    w.error_type = null;
    w.evidence = "";
  }
  renderTimeline();
}

function deleteSelectedSegment() {
  if (selectedIdx >= 0 && selectedIdx < annotation.working.length) {
    annotation.working.splice(selectedIdx, 1);
    annotation.idle = [];
    idleComputed = false;
    selectedIdx = annotation.working.length ? Math.max(0, selectedIdx - 1) : -1;
    renderTimeline();
    setStatus('已删除工作段，请重新计算 Idle 补集。');
  }
}

function autoComputeIdle() {
  if (!requireVideo()) return;
  let dur = annotation.duration;
  let sorted = [...annotation.working].sort((a,b) => a.start - b.start);
  let idles = [];
  let cursor = 0.0;
  sorted.forEach(w => {
    if (w.start > cursor) idles.push({ start: cursor, end: w.start });
    cursor = Math.max(cursor, w.end);
  });
  if (cursor < dur) idles.push({ start: cursor, end: dur });
  annotation.idle = idles;
  idleComputed = true;
  renderTimeline();
  setStatus('已按视频时长 ' + formatTime(dur) + ' 生成 ' + idles.length + ' 个 Idle 区间。');
}

function exportJSON() {
  if (!requireVideo()) return;
  if(!updateProjectFields())return;
  let blob = new Blob([JSON.stringify(annotation, null, 2)], { type: "application/json" });
  let url = URL.createObjectURL(blob);
  let a = document.createElement('a');
  a.href = url;
  a.download = annotation.clip.replace(/\.[^/.]+$/, "") + "_annotation_v2.1.json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  setStatus(annotation.text_description.trim()?'已导出当前视频标注；未确认的工作段仍标记为“无法判断”，请继续复核。':'已导出待复核草稿。任务描述为空，当前文件不能通过严格质检；已有标注已保存。');
}

// Keyboard shortcuts
window.addEventListener('keydown', (e) => {
  if (e.target.closest('input,textarea,select,button,a,video,[contenteditable]')) return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.code === 'ArrowLeft') { e.preventDefault(); stepFrame(-1); }
  else if (e.code === 'ArrowRight') { e.preventDefault(); stepFrame(1); }
  else if (e.key === '[') { markWorkingStart(); }
  else if (e.key === ']') { markWorkingEnd(); }
});

// Native controls retain their keyboard behavior; event listeners replace the
// historical inline event attributes without changing their public functions.
const clickBindings={openVideo:()=>document.getElementById('fileInput').click(),exportJSON,computeIdle:autoComputeIdle,stepBack:()=>stepFrame(-1),stepForward:()=>stepFrame(1),togglePlay,markStart:markWorkingStart,markEnd:markWorkingEnd,deleteSegment:deleteSelectedSegment,timelineBar:seekTimeline};
Object.entries(clickBindings).forEach(([id,handler])=>{const control=document.getElementById(id);control.removeAttribute('onclick');control.addEventListener('click',handler);});
document.getElementById('fileInput').removeAttribute('onchange');document.getElementById('fileInput').addEventListener('change',event=>loadVideoFile(event.target));
['inpStep','selErrorType','txtEvidence'].forEach(id=>{const control=document.getElementById(id);control.removeAttribute('onchange');control.addEventListener('change',updateSelectedSegment);});
document.getElementById('selVerdict').removeAttribute('onchange');document.getElementById('selVerdict').addEventListener('change',onVerdictChange);
renderTimeline();
</script>
</body>
</html>
